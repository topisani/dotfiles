[ui.colors]
selected = { fg = "bright white", bg = "233" }
"revisions details selected" = { bg = "233" }
"revisions details selected dimmed" = { fg = "bright cyan" }
"picker selected" = { fg = "bright white", bg = "233" }
"revset completion selected" = { bg = "233" }

# >>> jt tasks — managed by `jt install --jjui`, edits here will be overwritten >>>
# Task-aware log template. Uses jj's `trailers` keyword — real trailer parsing,
# not the substring matching the old revset board relied on. Non-task commits
# fall through to builtin_log_compact so the working copy still reads normally.
[revisions]
template = '''
if(trailers.contains_key("Task-Status"),
  separate(" ",
    format_short_change_id(change_id),
    label("task_" ++ trailers.filter(|t| t.key()=="Task-Status").map(|t| t.value()).join(""),
      "[" ++ trailers.filter(|t| t.key()=="Task-Status").map(|t| t.value()).join("") ++ "]"),
    if(trailers.contains_key("Priority"),
      label("task_priority", "(" ++ trailers.filter(|t| t.key()=="Priority").map(|t| t.value()).join("") ++ ")")),
    description.first_line(),
    if(parents.any(|p| p.trailers().contains_key("Task-Status")),
      label("task_needs", "(needs " ++ parents.filter(|p| p.trailers().contains_key("Task-Status")).map(|p| p.change_id().shortest(8)).join(" ") ++ ")")),
  ) ++ "\n",
  builtin_log_compact
)
'''

[[actions]]
name = "jt_status"
desc = "task: set status"
lua = '''
local id = context.change_id()
if not id then return end
local s = choose({ options = {"todo","ready","doing","investigating","blocked","done"}, title = "Task-Status" })
if s then
  exec_shell("jt set " .. id .. " status=" .. s)
  revisions.refresh({ keep_selections = true })
  flash("status → " .. s)
end
'''
seq = ["t", "s"]
scope = "revisions"

[[actions]]
name = "jt_priority"
desc = "task: set priority"
lua = '''
local id = context.change_id()
if not id then return end
local p = choose({ options = {"P0","P1","P2","P3"}, title = "Priority" })
if p then
  exec_shell("jt set " .. id .. " priority=" .. p)
  revisions.refresh({ keep_selections = true })
  flash("priority → " .. p)
end
'''
seq = ["t", "p"]
scope = "revisions"

[[actions]]
name = "jt_new"
desc = "task: file a new one"
lua = '''
local s = input({ title = "New task", prompt = "summary: " })
if s and s ~= "" then
  exec_shell("jt new " .. string.format("%q", s))
  revisions.refresh()
  flash("filed: " .. s)
end
'''
seq = ["t", "n"]
scope = "revisions"

[[actions]]
name = "jt_block"
desc = "task: block with a reason"
lua = '''
local id = context.change_id()
if not id then return end
local r = input({ title = "Block task", prompt = "reason: " })
if r and r ~= "" then
  exec_shell("jt block " .. id .. " " .. string.format("%q", r))
  revisions.refresh({ keep_selections = true })
  flash("blocked")
end
'''
seq = ["t", "b"]
scope = "revisions"

[[actions]]
name = "jt_done"
desc = "task: done (strip trailers)"
lua = '''
local id = context.change_id()
if not id then return end
exec_shell("jt done " .. id)
revisions.refresh()
flash("done: " .. id)
'''
seq = ["t", "d"]
scope = "revisions"

[[actions]]
name = "jt_start"
desc = "task: start (rebase onto tip, edit)"
lua = '''
local id = context.change_id()
if not id then return end
exec_shell("jt start " .. id)
revisions.refresh({ selected_revision = id })
flash("started: " .. id)
'''
seq = ["t", "S"]
scope = "revisions"

[[actions]]
name = "jt_evo"
desc = "task: evolution trail"
lua = '''
local id = context.change_id()
if not id then return end
exec_shell("jt evo " .. id .. " | less -R")
'''
seq = ["t", "e"]
scope = "revisions"
# <<< jt tasks <<<
