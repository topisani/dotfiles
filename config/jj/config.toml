"$schema" = 'https://jj-vcs.github.io/jj/prerelease/config-schema.json'

[user]
name = "Tobias Pisani"
email = "mail@topisani.dev"

[ui]
default-command = "log"
diff-editor = ":builtin"
# pager = ["sh", "-c", "diff-so-fancy | less -RFX"]

[merge-tools.difft]
program = "difft"
diff-args = ["--color=always", "$left", "$right"]

[templates]
# draft_commit_description = '''
# concat(
#   description,
#   surround(
#     "\nJJ: This commit contains the following changes:\n", "\n",
#     indent("JJ:     ", diff.stat(72)),
#   ),
#   indent("JJ: ", diff.git())
# )
# '''
draft_commit_description = 'builtin_draft_commit_description_with_diff'
log_node = '''
if(self && !current_working_copy && !immutable && !conflict && in_branch(self),
  "◇",
  builtin_log_node
)
'''

[template-aliases]
'format_short_signature(signature)' = 'signature'
"in_branch(commit)" = 'commit.contained_in("immutable_heads()..bookmarks()")'


[revset-aliases]
# Tasks are commits with a `Task-Status:` trailer — the board lives in `jt`
# (~/.bin/jt), not here. This alias remains only because the two settings below
# need it: revsets can't parse trailers, so it substring-matches. That is fine
# as a coarse filter; `jt` re-checks the actual trailer block.
'tasks()' = 'description(substring:"Task-Status:")'
# A task placeholder is one nobody has built on: no code written into it (still
# `empty()`), nothing stacked on top (`visible_heads()` — a commit with any
# child at all drops out, so this also never hides an ancestor of something
# shown), and not sitting under any workspace's `@` (`working_copies()` — most
# `doing` tasks are still empty right after `jt start`, before the first edit,
# and are exactly the case a plain `tasks() & empty()` used to hide).
'task_placeholders()' = '(tasks() & empty() & visible_heads()) ~ working_copies()'

[revsets]
bookmark-advance-to = "@-"
# Hide EMPTY task placeholders from the default `jj log` — they live off to the
# side; view the board with `jt`. Once you `jt start` a task and write real code
# it's non-empty and shows in the log like any other change, even while it still
# carries its trailer.
log = "(present(@) | ancestors(immutable_heads().., 2) | trunk()) ~ task_placeholders()"

immutable_heads="none()"

[colors]
# Highlight hunks with background
"diff removed token" = { bg = "#221111", underline = false }
"diff added token" = { bg = "#002200", underline = false }

[git]
# Prevent pushing anything labeled "private", or any open task. `jt done` no
# longer strips the trailer — it just flips Task-Status to done, so the commit
# still matches `tasks()` and stays private until `jt strip` (normally via
# `/jt:cleanup`) actually clears it and makes the commit landable.
private-commits = "description(glob:'private:*') | tasks()"
track-default-bookmark-on-clone = false

[remotes.origin]
auto-track-bookmarks = "*"
auto-track-created-bookmarks = "*"

[remotes.upstream]
auto-track-bookmarks = "main"

[snapshot]
# auto-track = 'none()'

[aliases]
l = ["log", "-r", "ancestors(reachable(@, mutable()), 5)"]
delta = [
  '--config=ui.pager=["delta", "--line-numbers", "--navigate", "--side-by-side"]',
  'diff',
  '--git',
]

difft = ["diff", "--tool=difft"]

diffstat = ['util', 'exec', '--', 'jj-diffstat']

notrack = [
  'util', 'exec', '--', 'bash', '-c',
  'jj config set --repo snapshot.auto-track "$(jj config get snapshot.auto-track) & ~$0" && jj file untrack $0'
]
exclude = [
  'util', 'exec', '--', 'sh', '-c', 'git-exclude "$0" && jj file untrack "$0"'
]

# >>> jt tasks — managed by `jt install --jjui`, edits here will be overwritten >>>
[colors.task_todo]
fg = "blue"
[colors.task_ready]
fg = "bright blue"
[colors.task_doing]
fg = "yellow"
[colors.task_investigating]
fg = "magenta"
[colors.task_blocked]
fg = "bright red"
[colors.task_testing]
fg = "bright yellow"
[colors.task_deferred]
fg = "white"
[colors.task_done]
fg = "bright black"
[colors.task_priority]
fg = "bright black"
[colors.task_needs]
fg = "bright black"
